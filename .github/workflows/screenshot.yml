name: Screenshot live site

on:
  push:
    branches: [main]
    paths: ['.github/workflows/screenshot.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          mkdir shot && cd shot && npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Take screenshots
        working-directory: shot
        run: |
          cat > shot.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const targets = [
              ['desktop', 'https://ianes1978.github.io/SmartClips/', { viewport: { width: 1300, height: 900 } }],
              ['mobile',  'https://ianes1978.github.io/SmartClips/', devices['Pixel 7']],
              ['mobile-lowercase', 'https://ianes1978.github.io/smartclips/', devices['Pixel 7']],
            ];
            for (const [name, url, opts] of targets) {
              const ctx = await b.newContext(opts);
              const p = await ctx.newPage();
              const res = await p.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => null);
              await p.waitForTimeout(3000);
              await p.screenshot({ path: `${name}.png`, fullPage: name === 'desktop' ? false : true });
              console.log(`${name}: ${url} -> HTTP ${res ? res.status() : 'ERR'} | title: ${await p.title()}`);
              await ctx.close();
            }
            await b.close();
          })();
          JS
          node shot.js | tee result.txt
          date -u >> result.txt

      - name: Save screenshots to the 'screenshots' branch
        working-directory: shot
        run: |
          git init -q out && cp *.png result.txt out/ && cd out
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout -q -b screenshots && git add . && git commit -qm "Live site screenshots"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
